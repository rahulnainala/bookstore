name: Reset demo data

# Restores the live demo to its seeded state every night, so anything visitors add, edit or
# order (including with the shared demo admin) is cleaned up.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    # Only runs once the database secret has been added to the repository.
    if: ${{ vars.DEMO_RESET_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:reset
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
